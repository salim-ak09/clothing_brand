name: AETHER Production Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx turbo run generate

      - name: Run ESLint
        run: npx turbo run lint

      - name: Build Monorepo (Next.js Edge)
        run: npx turbo run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Add placeholder env vars required for build
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aether"
          STRIPE_SECRET_KEY: "sk_test_mock"
          NEXTAUTH_SECRET: "mock_secret"
          UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "mock_token"
