version: '3.9'
services:
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    depends_on:
      - orchestrator
      - risk-service

  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=development
    depends_on:
      - kafka

  scheduler:
    build:
      context: ./apps/scheduler
      dockerfile: Dockerfile
    container_name: scheduler
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=development
    depends_on:
      - redis

  bot-runner:
    build:
      context: ./apps/bot-runner
      dockerfile: Dockerfile
    container_name: bot-runner
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=development
    depends_on:
      - orchestrator

  stealth-env:
    build:
      context: ./apps/stealth-env
      dockerfile: Dockerfile
    container_name: stealth-env
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=development
    depends_on:
      - bot-runner

  proxy-manager:
    build:
      context: ./services/proxy-manager
      dockerfile: Dockerfile
    container_name: proxy-manager
    ports:
      - "8005:8005"
    environment:
      - NODE_ENV=development
    depends_on:
      - vault

  risk-service:
    build:
      context: ./services/risk-service
      dockerfile: Dockerfile
    container_name: risk-service
    ports:
      - "8006:8006"
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres

  # Supporting infrastructure (lightweight local versions)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: riskdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.5
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: server -dev -dev-root-token-id=root-token

networks:
  default:
    driver: bridge
